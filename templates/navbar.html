<aside class="sidebar" id="sidebar">
    <script>
        // Set state synchronously without any animations explicitly!
        try {
            if (localStorage.getItem('sidebarCollapsed') === '1') {
                document.getElementById('sidebar').classList.add('collapsed');
                // expand mainContent when the DOM is ready
                document.addEventListener('DOMContentLoaded', function() {
                    const mainContent = document.getElementById('mainContent');
                    if (mainContent) mainContent.classList.add('expanded');
                });
            }
        } catch(e) {}
        
        // Re-enable smooth transitions for future human clicks AFTER initial layout settles
        window.addEventListener('load', () => {
            setTimeout(() => {
                const sb = document.getElementById('sidebar');
                if (sb) sb.classList.add('transitions-enabled');
            }, 50);
        });
    </script>

    <script>
        function toggleSubmenu(id, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            const submenu = document.getElementById('submenu-' + id);
            const arrow = document.getElementById('arrow-' + id);
            if (submenu) submenu.classList.toggle('open');
            if (arrow) arrow.classList.toggle('rotated');
        }

        function setActiveMenuItem(element, menuId) {
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            if (element && typeof element === 'object') {
                element.classList.add('active');
            }
            sessionStorage.setItem('activeMenu', menuId);
        }

        function setActiveSubmenu(element, submenuId) {
            try {
                document.querySelectorAll('.submenu-item').forEach(item => item.classList.remove('active'));
                if (element && typeof element === 'object') {
                    element.classList.add('active');
                }
                sessionStorage.setItem('activeSubmenu', submenuId);
            } catch (error) {
                console.error('Error in setActiveSubmenu:', error);
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            if (sidebar) sidebar.classList.toggle('collapsed');
            if (mainContent) mainContent.classList.toggle('expanded');
            const isCollapsed = sidebar && sidebar.classList.contains('collapsed');
            try { localStorage.setItem('sidebarCollapsed', isCollapsed ? '1' : '0'); } catch (e) { }
        }

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('open');
        }

        function closeMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar && window.innerWidth <= 968) {
                sidebar.classList.remove('open');
            }
        }

        function getCurrentProjectIdFromUrl() {
            try {
                const pathMatch = window.location.pathname.match(/^\/dashboard\/project\/(\d+)/);
                if (pathMatch && pathMatch[1]) return Number(pathMatch[1]);
                const scopedProjectMatch = window.location.pathname.match(/^\/project\/(\d+)\//);
                if (scopedProjectMatch && scopedProjectMatch[1]) return Number(scopedProjectMatch[1]);
                const queryId = Number(new URLSearchParams(window.location.search).get('project_id') || 0);
                return queryId || null;
            } catch (error) {
                return null;
            }
        }

        function setProjectMenuOpen(projectSlug, shouldOpen) {
            const submenu = document.getElementById('submenu-' + projectSlug);
            const arrow = document.getElementById('arrow-' + projectSlug);
            if (submenu) submenu.classList.toggle('open', !!shouldOpen);
            if (arrow) arrow.classList.toggle('rotated', !!shouldOpen);
            if (shouldOpen) {
                sessionStorage.setItem('openProjectSlug', projectSlug);
            } else if (sessionStorage.getItem('openProjectSlug') === projectSlug) {
                sessionStorage.removeItem('openProjectSlug');
            }
        }

        function confirmLogout(event) {
            event.preventDefault();
            if (!confirm('Apakah Anda yakin ingin logout?')) return;
            fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' })
                .finally(() => { window.location.href = '/login'; });
        }

        function applySidebarEvents() {
            document.querySelectorAll('.menu-item[data-project-id]').forEach(item => {
                // Hapus old listener kl udh dipanggil 2x
                const newClone = item.cloneNode(true);
                if(item.parentNode) item.parentNode.replaceChild(newClone, item);
                
                newClone.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const projectSlug = this.getAttribute('data-project-slug');
                    const projectId = this.getAttribute('data-project-id');
                    const submenu = document.getElementById('submenu-' + projectSlug);
                    const isOpen = submenu ? submenu.classList.contains('open') : false;
                    setProjectMenuOpen(projectSlug, !isOpen);
                    setActiveMenuItem(this, 'project-' + projectId);
                });
            });

            document.querySelectorAll('.submenu-item').forEach(item => {
                const newClone = item.cloneNode(true);
                if(item.parentNode) item.parentNode.replaceChild(newClone, item);

                newClone.addEventListener('click', function (e) {
                    const parentSubmenu = this.closest('.submenu');
                    if (parentSubmenu && parentSubmenu.id && parentSubmenu.id.startsWith('submenu-')) {
                        const projectSlug = parentSubmenu.id.replace('submenu-', '').replace('overhead-', '');
                        sessionStorage.setItem('openProjectSlug', projectSlug);
                    }
                    if (this.getAttribute('href') === '#') {
                        e.preventDefault();
                    }
                    if (window.innerWidth <= 968) {
                        closeMobileMenu();
                    }
                });
            });
        }

        function buildSidebarHTML(allProjects) {
            const container = document.getElementById('dynamicProjects');
            if (!container) return;

            const currentPath = window.location.pathname;
            const currentProjectIdFromUrl = getCurrentProjectIdFromUrl();

            const projectMap = new Map();
            allProjects.forEach(project => {
                const projectName = project.project_name;
                if (!projectName) return;
                if (!projectMap.has(projectName)) {
                    projectMap.set(projectName, project);
                }
            });

            const uniqueProjects = [...projectMap.values()];
            if (uniqueProjects.length === 0) {
                container.innerHTML = '';
                return;
            }

            let savedOpenSlug = sessionStorage.getItem('openProjectSlug') || null;
            let slugToOpen = savedOpenSlug;

            if (currentProjectIdFromUrl) {
                const activeProj = uniqueProjects.find(p => Number(p.id) === Number(currentProjectIdFromUrl));
                if (activeProj && activeProj.project_name) {
                    slugToOpen = activeProj.project_name.toLowerCase().replace(/\s+/g, '-');
                }
            }

            if (slugToOpen) {
                sessionStorage.setItem('openProjectSlug', slugToOpen);
            }

            let html = '';
            uniqueProjects.forEach(project => {
                const projectName = project.project_name;
                const projectIdNumber = project.id;
                const projectId = projectName.toLowerCase().replace(/\s+/g, '-');
                const isCurrentProject = Number(currentProjectIdFromUrl) === Number(projectIdNumber);
                
                const dashboardActiveClass = currentPath.startsWith('/dashboard/project/') && isCurrentProject ? ' active' : '';
                const jasaActiveClass = currentPath.startsWith('/project/') && currentPath.includes('/jasa') && isCurrentProject ? ' active' : '';
                const materialActiveClass = currentPath.startsWith('/material') && isCurrentProject ? ' active' : '';
                const overheadActiveClass = currentPath.startsWith('/project/') && currentPath.includes('/overhead') && isCurrentProject ? ' active' : '';
                const kasbonActiveClass = currentPath.startsWith('/verifikasi-kasbon') && isCurrentProject ? ' active' : '';
                const pettyCashActiveClass = currentPath.startsWith('/petty-cash') && isCurrentProject ? ' active' : '';

                const isMainFolderOpen = (slugToOpen === projectId) ? ' open' : '';
                const isMainArrowRotated = (slugToOpen === projectId) ? ' rotated' : '';
                
                const isOverheadPage = currentPath.includes('/overhead') || currentPath.startsWith('/verifikasi-kasbon');
                const isOverheadFolderOpen = (slugToOpen === projectId && isOverheadPage) ? ' open' : '';
                const isOverheadArrowRotated = (slugToOpen === projectId && isOverheadPage) ? ' rotated' : '';

                const mainActive = isCurrentProject ? ' active' : '';

                html += `
                <div class="menu-item${mainActive}" data-project-id="${projectIdNumber}" data-project-slug="${projectId}" data-tooltip="${projectName}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>${projectName}</span>
                    <svg class="menu-arrow${isMainArrowRotated}" id="arrow-${projectId}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
                <div class="submenu${isMainFolderOpen}" id="submenu-${projectId}">
                    <a href="/dashboard/project/${projectIdNumber}" class="submenu-item level-2${dashboardActiveClass}" onclick="setActiveSubmenu(this, 'dashboard'); closeMobileMenu();">Dashboard</a>
                    <a href="/project/${projectIdNumber}/jasa" class="submenu-item level-2${jasaActiveClass}" onclick="setActiveSubmenu(this, 'jasa'); closeMobileMenu();">Jasa</a>
                    <a href="/material?project_id=${projectIdNumber}" class="submenu-item level-2${materialActiveClass}" onclick="setActiveSubmenu(this, 'material'); closeMobileMenu();">Material</a>
                    <div class="menu-item" data-tooltip="Overhead" style="padding-left: 52px; font-size: 13px; color: #666;" onclick="event.stopPropagation(); toggleSubmenu('overhead-${projectId}');">
                        <span>Overhead</span>
                        <svg class="menu-arrow${isOverheadArrowRotated}" id="arrow-overhead-${projectId}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                    <div class="submenu${isOverheadFolderOpen}" id="submenu-overhead-${projectId}" style="padding-left: 20px;">
                        <a href="/project/${projectIdNumber}/overhead" class="submenu-item level-2${overheadActiveClass}" style="padding-left: 75px;" onclick="setActiveSubmenu(this, 'overhead-progress'); closeMobileMenu();">Progress</a>
                        <a href="/verifikasi-kasbon?project_id=${projectIdNumber}" class="submenu-item level-2${kasbonActiveClass}" style="padding-left: 75px;" onclick="setActiveSubmenu(this, 'kasbon-mandor'); closeMobileMenu();">Kasbon Mandor</a>
                    </div>
                    <a href="/petty-cash?project_id=${projectIdNumber}" class="submenu-item level-2${pettyCashActiveClass}" onclick="setActiveSubmenu(this, 'petty-cash'); closeMobileMenu();">Petty Cash</a>
                </div>
                `;
            });

            // Prevent transitions on initial render to stop blinking
            container.classList.add('disable-transitions');
            container.innerHTML = html;
            
            // Force browser repaint to recognize DOM insertion before enabling transition
            void container.offsetHeight; 
            
            container.classList.remove('disable-transitions');

            applySidebarEvents();
        }

        async function renderSidebarProjects() {
            const cachedDataStr = sessionStorage.getItem('cachedSidebarProjects');

            try {
                // Fetch fresh data in the background
                const [resPo, resNonPo] = await Promise.all([
                    fetch('/api/projects?type=po&status=active', { credentials: 'same-origin' }),
                    fetch('/api/projects?type=non_po&status=active', { credentials: 'same-origin' })
                ]);

                if (resPo.status === 401 || resNonPo.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const dataPo = await resPo.json();
                const dataNonPo = await resNonPo.json();
                const allProjects = [
                    ...(dataPo.success ? dataPo.data : []),
                    ...(dataNonPo.success ? dataNonPo.data : [])
                ];

                const newlyFetchedDataStr = JSON.stringify(allProjects);
                
                // If the data has changed (or no cache), we rebuild the UI
                if (newlyFetchedDataStr !== cachedDataStr) {
                    sessionStorage.setItem('cachedSidebarProjects', newlyFetchedDataStr);
                    buildSidebarHTML(allProjects);
                }

            } catch (error) {
                console.error('Error loading projects:', error);
            }
        }

        // Tutup sidebar saat klik di luar (mobile)
        document.addEventListener('click', function (event) {
            const sidebar = document.getElementById('sidebar');
            const menuToggle = document.querySelector('.toggle-btn');
            if (window.innerWidth <= 968) {
                if (sidebar && menuToggle &&
                    !sidebar.contains(event.target) &&
                    !menuToggle.contains(event.target)) {
                    sidebar.classList.remove('open');
                }
            }
        });

        document.addEventListener('DOMContentLoaded', function () {
            renderSidebarProjects();
        });

        // Protect central functions from being overridden by page-specific duplicate scripts
        (function() {
            const protectedFunctions = {
                renderSidebarProjects,
                toggleSidebar,
                toggleSubmenu,
                toggleMobileMenu,
                closeMobileMenu,
                setActiveMenuItem,
                setActiveSubmenu,
                confirmLogout
            };
            for (const [name, fn] of Object.entries(protectedFunctions)) {
                try {
                    Object.defineProperty(window, name, {
                        get: () => fn,
                        set: () => { console.warn(`Ignored override of ${name} to maintain non-blinking glass theme`); },
                        configurable: false
                    });
                } catch(e) {}
            }
        })();
    </script>
