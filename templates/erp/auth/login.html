  <title>Masuk · SSM ERP</title>

  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:#ffffff}
    body{overflow:hidden;background:#ffffff;color:#14233a;font-family:Inter,Arial,sans-serif}
    .intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow:hidden;background:#ffffff;opacity:1;visibility:visible;transition:opacity .72s cubic-bezier(.4,0,.2,1),visibility 0s linear .72s}
    .intro:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 35%,rgba(204,211,214,.18) 100%)}
    .intro-logo-frame{position:absolute;inset:0;display:grid;place-items:center;overflow:visible;background:#ffffff}
    .intro-logo{width:min(62vw,420px);aspect-ratio:4050/4100}
    .intro-logo svg{display:block;width:100%;height:100%;overflow:visible}
    .intro-logo #blueStroke,.intro-logo #greenStroke{fill:none;stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
    .intro-logo #blueStroke{stroke:#0d3f96;stroke-dasharray:var(--lenBlue);stroke-dashoffset:var(--lenBlue);animation:introDrawBlue 1.5s cubic-bezier(.65,0,.35,1) forwards,introFadeOut .5s ease-out 1.55s forwards}
    .intro-logo #greenStroke{stroke:#0a7a2e;stroke-dasharray:var(--lenGreen);stroke-dashoffset:var(--lenGreen);animation:introDrawGreen 1.3s cubic-bezier(.65,0,.35,1) .55s forwards,introFadeOut .5s ease-out 2s forwards}
    .intro-logo #blueFill{fill:url(#introGradBlue);opacity:0;animation:introFadeIn .9s ease-out 1.3s forwards}
    .intro-logo #greenFill{fill:url(#introGradGreen);opacity:0;animation:introFadeIn .9s ease-out 1.75s forwards}
    @keyframes introDrawBlue{to{stroke-dashoffset:0}}
    @keyframes introDrawGreen{to{stroke-dashoffset:0}}
    @keyframes introFadeOut{to{opacity:0}}
    @keyframes introFadeIn{to{opacity:1}}
    .login-page{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px;position:relative;overflow:hidden;background:#ffffff}
    .orb{position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none}.orb.one{width:420px;height:420px;left:-250px;top:-230px;background:rgba(33,111,218,.07)}.orb.two{width:360px;height:360px;right:-200px;bottom:-210px;background:rgba(40,178,100,.07)}
    .login-stage{width:min(430px,calc(100vw - 36px));position:absolute;left:50%;top:50%;z-index:1;opacity:0;transform:translate(-50%,calc(-50% + 22px)) scale(.985);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1)}
    .brand{display:flex;align-items:center;justify-content:center;gap:4px;width:max-content;max-width:100%;margin:0 auto 18px}
    .brand-logo{width:96px;height:96px;flex:0 0 96px;object-fit:contain;filter:drop-shadow(0 9px 18px rgba(20,73,132,.13))}
    .brand-copy{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;width:auto;min-width:0;text-align:left;transform:translateY(-1px)}.brand-copy strong,.brand-copy small{position:static;display:block;width:auto;margin-left:0;padding:0;text-align:left;transform:none}.brand-copy strong{margin-top:0;color:#0b1d35;font-size:28px;line-height:1.05;letter-spacing:.035em}.brand-copy small{margin-top:8px;color:#718097;font-size:11px;font-weight:700;line-height:1;letter-spacing:.15em;white-space:nowrap}
    .login-card{padding:31px 33px 28px;border:1px solid rgba(207,218,231,.86);border-radius:20px;background:rgba(255,255,255,.91);box-shadow:0 28px 80px rgba(28,52,82,.13),0 3px 10px rgba(28,52,82,.04);backdrop-filter:blur(18px)}
    .login-heading{margin-bottom:23px}.login-heading .eyebrow{margin-bottom:6px}.login-heading h1{margin:0;color:#102039;font-size:25px;letter-spacing:-.03em}.login-heading p{margin:7px 0 0;color:#718097;font-size:12px}
    .reveal{opacity:0;transform:translateY(12px);transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1)}
    .field{margin-bottom:15px}.field label{display:block;margin-bottom:7px;color:#405068;font-size:11px;font-weight:700}.field input{width:100%;height:46px;padding:0 14px;border:1px solid #ccd8e5;border-radius:11px;background:#fbfdff;color:#14233a;font:500 13px Inter,Arial,sans-serif;outline:none;transition:border-color .2s,box-shadow .2s,background .2s,transform .2s}.field input:hover{border-color:#adbed1}.field input:focus{border-color:#2475d5;background:#fff;box-shadow:0 0 0 4px rgba(36,117,213,.1);transform:translateY(-1px)}
    .login-error{min-height:18px;margin:-2px 0 8px;color:#b53b48;font-size:11px}
    .login-submit{width:100%;height:46px;border:0;border-radius:11px;background:linear-gradient(135deg,#1559b5,#2582e5);color:#fff;font:700 12px Inter,Arial,sans-serif;cursor:pointer;box-shadow:0 9px 22px rgba(31,102,204,.24);transition:transform .16s,box-shadow .16s,filter .16s}.login-submit:hover{filter:brightness(1.05);box-shadow:0 13px 28px rgba(31,102,204,.3);transform:translateY(-2px)}.login-submit:active{transform:scale(.98)}.login-submit:disabled{opacity:.7;cursor:wait}
    .login-foot{margin:17px 0 0;text-align:center;color:#8a97a8;font-size:10px}
    .login-success{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(8,20,14,.52);backdrop-filter:blur(9px);opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .25s}.login-success__content{display:grid;justify-items:center;width:min(390px,100%);padding:42px 36px 32px;border:1px solid rgba(16,35,26,.04);border-radius:28px;background:#fff;box-shadow:0 28px 70px -14px rgba(0,0,0,.38);transform:scale(.84) translateY(14px);opacity:0;transition:transform .38s cubic-bezier(.2,.9,.3,1.3),opacity .3s ease}.login-success__mark{position:relative;display:grid;place-items:center;width:96px;height:96px;margin-bottom:23px;border-radius:50%;background:#d9f5e6;transform:scale(0)}.login-success__mark:after{content:"";position:absolute;inset:0;border:2px solid #1fae64;border-radius:50%;opacity:0}.login-success__mark svg{width:60px;height:60px;overflow:visible;fill:none;stroke:#1fae64;stroke-linecap:round;stroke-linejoin:round}.login-success__mark .success-ring{stroke-width:3;stroke-dasharray:166;stroke-dashoffset:166}.login-success__mark .success-check{stroke-width:4;stroke-dasharray:48;stroke-dashoffset:48}.login-success strong{margin:0 0 7px;color:#10231a;font-size:21px;letter-spacing:-.02em;opacity:0}.login-success small{max-width:280px;margin:0 0 27px;color:#6b7a72;font-size:13px;line-height:1.5;text-align:center;opacity:0}.login-success__continue{width:100%;padding:13px 18px;border:0;border-radius:13px;background:#1fae64;color:#fff;font:700 13px Inter,Arial,sans-serif;cursor:pointer;box-shadow:0 8px 20px rgba(31,174,100,.2);opacity:0;transition:background .15s ease,box-shadow .15s ease,transform .15s ease}.login-success__continue:hover{background:#1a9a58;box-shadow:0 10px 24px rgba(31,174,100,.27);transform:translateY(-1px)}body.login-complete .login-page{filter:blur(7px);transform:scale(1.012)}body.login-complete .login-success{opacity:1;visibility:visible;transition-delay:0s}body.login-complete .login-success__content{opacity:1;transform:scale(1) translateY(0)}body.login-complete .login-success__mark{animation:successRingPop .42s cubic-bezier(.34,1.56,.64,1) .1s forwards}body.login-complete .login-success__mark .success-ring{animation:successDrawCircle .5s ease-out .35s forwards}body.login-complete .login-success__mark .success-check{animation:successDrawCheck .35s ease-out .85s forwards}body.login-complete .login-success__mark:after{animation:successPulse .7s ease-out 1.1s}body.login-complete .login-success strong{animation:successFadeUp .4s ease-out .95s forwards}body.login-complete .login-success small{animation:successFadeUp .4s ease-out 1.05s forwards}body.login-complete .login-success__continue{animation:successFadeUp .4s ease-out 1.15s forwards}@keyframes successRingPop{to{transform:scale(1)}}@keyframes successDrawCircle{to{stroke-dashoffset:0}}@keyframes successDrawCheck{to{stroke-dashoffset:0}}@keyframes successPulse{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.35);opacity:0}}@keyframes successFadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}.login-page,.login-stage{transition:filter .25s ease,transform .35s ease}
    body.login-ready .intro{opacity:0;visibility:hidden}body.login-ready .login-stage{opacity:1;transform:translate(-50%,-50%) scale(1)}body.login-ready .reveal{opacity:1;transform:translateY(0)}body.login-ready .login-heading{transition-delay:.14s}body.login-ready .field.username{transition-delay:.25s}body.login-ready .field.password{transition-delay:.36s}body.login-ready .login-submit{transition-delay:.47s}body.login-ready .login-foot{transition-delay:.58s}
    @media(max-height:760px){body{overflow:auto}.login-page{padding:18px}.brand{margin-bottom:10px}.brand-logo{width:80px;height:80px;flex-basis:80px}.login-card{padding:24px 28px}.login-heading{margin-bottom:17px}}
    @media(max-width:520px){html,body,.intro,.intro-logo-frame,.login-page{background:#ffffff}.login-page{padding:18px}.login-card{padding:27px 22px}.login-success__content{padding:38px 25px 27px;border-radius:24px}.orb,.intro:after{display:none}}

        <div class="field password reveal"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required></div>
        <div id="error" class="login-error" role="alert"></div>
        <button class="login-submit reveal" id="loginButton" type="submit">Masuk ke Sistem</button>
        <p class="login-foot reveal">Akses aman untuk sistem pengendalian proyek SSM</p>
      </form>
    </div>
  </main>
  <div class="login-success" id="loginSuccess" aria-live="polite">
    <div class="login-success__content">
      <span class="login-success__mark" aria-hidden="true">
        <svg viewBox="0 0 56 56"><circle class="success-ring" cx="28" cy="28" r="26"/><path class="success-check" d="M17 29l7.5 7.5L39 20"/></svg>
      </span>
      <strong>Login Berhasil</strong>
      <small>Selamat datang kembali! Anda akan diarahkan ke dashboard SSM ERP.</small>

    </div>
  </div>
  <script>
    const intro=document.getElementById('intro');
    let introFinished=false;
    const finishIntro=()=>{if(introFinished)return;introFinished=true;document.body.classList.add('login-ready');setTimeout(()=>document.getElementById('username').focus(),760)};
    const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion){
      finishIntro();
    }else{
      const blueStroke=document.getElementById('blueStroke');
      const greenStroke=document.getElementById('greenStroke');
      const greenFill=document.getElementById('greenFill');
      document.documentElement.style.setProperty('--lenBlue',blueStroke.getTotalLength());
      document.documentElement.style.setProperty('--lenGreen',greenStroke.getTotalLength());
      greenFill.addEventListener('animationend',()=>setTimeout(finishIntro,550));
      setTimeout(finishIntro,3600);
    }
    document.getElementById('loginForm').addEventListener('submit',async function(e){
      e.preventDefault();
      const button=document.getElementById('loginButton');
      const error=document.getElementById('error');
      button.disabled=true;button.textContent='Memproses…';error.textContent='';
      const token=document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||'';
      try{
        const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':token},body:JSON.stringify({username:username.value,password:password.value})});
        const data=await response.json();
        if(response.ok&&data.success){const destination=new URLSearchParams(location.search).get('next')||'/erp/';button.textContent='Berhasil';sessionStorage.setItem('ssm-login-transition','1');requestAnimationFrame(()=>document.body.classList.add('login-complete'));setTimeout(()=>location.assign(destination),2300);return}
        error.textContent=data.message||'Login gagal.';
      }catch(_){error.textContent='Tidak dapat terhubung ke server.'}
      button.disabled=false;button.textContent='Masuk ke Sistem';
    });
  </script>
</body>
</html>
