{% load static %}<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk · SSM ERP</title><link rel="stylesheet" href="{% static 'css/erp.css' %}"><style>body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071426,#17355c)}.login-shell{width:min(920px,92vw);display:grid;grid-template-columns:1.1fr .9fr;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 25px 70px #0005}.login-brand{padding:54px;background:#0b1d35;color:#fff}.login-brand h1{font-size:34px;margin:20px 0 10px}.login-brand p{color:#aabbd0;line-height:1.7}.login-form{padding:54px;display:grid;align-content:center;gap:15px}.login-form h2{margin:0}.login-form button{width:100%}.login-error{color:#b53b48;font-size:12px}@media(max-width:720px){.login-shell{grid-template-columns:1fr}.login-brand{display:none}}</style></head><body><div class="login-shell"><section class="login-brand"><span class="brand-mark">S</span><h1>SSM ERP</h1><p>Sistem terintegrasi untuk proyek, Purchase Order, RAB, operasional lapangan, pengajuan dana, expense, invoice, dan cash flow.</p></section><form class="login-form" id="loginForm"><div><div class="eyebrow">Secure Access</div><h2>Masuk ke sistem</h2><p class="breadcrumb">Gunakan akun perusahaan yang aktif.</p></div><div class="field"><label>Username</label><input id="username" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><div id="error" class="login-error"></div><button class="btn" type="submit">Masuk</button></form></div><script>document.getElementById('loginForm').addEventListener('submit',async function(e){e.preventDefault();const token=document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||'';const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':token},body:JSON.stringify({username:username.value,password:password.value})});const data=await response.json();if(response.ok&&data.success){location.href=new URLSearchParams(location.search).get('next')||'/erp/'}else{document.getElementById('error').textContent=data.message||'Login gagal.'}});</script></body></html>
