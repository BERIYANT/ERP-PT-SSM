{% load static %}<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ page_title }} · SSM ERP</title><link rel="icon" type="image/png" href="{% static 'img/ssm.ico' %}?v=20260821-2"><link rel="shortcut icon" href="{% static 'img/ssm.ico' %}?v=20260821-2"><link rel="stylesheet" href="{% static 'css/erp.css' %}?v=20260821-29"><link rel="stylesheet" href="{% static 'css/erp-tabs.css' %}"><link rel="stylesheet" href="{% static 'css/erp-workbook.css' %}"><link rel="stylesheet" href="{% static 'css/warehouse.css' %}?v=20260821-1"><script>if(sessionStorage.getItem('ssm-login-transition')==='1')document.documentElement.classList.add('from-login');else if(sessionStorage.getItem('ssm-page-transition')==='1')document.documentElement.classList.add('page-transition-in')</script></head><body>{% block body %}{% endblock %}<script>(function(){const root=document.documentElement;if(root.classList.contains('from-login')){requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.add('dashboard-ready')));setTimeout(()=>{sessionStorage.removeItem('ssm-login-transition');root.classList.remove('from-login','dashboard-ready')},1800)}else if(root.classList.contains('page-transition-in')){sessionStorage.removeItem('ssm-page-transition');requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.add('page-transition-ready')));setTimeout(()=>root.classList.remove('page-transition-in','page-transition-ready'),900)}document.addEventListener('click',event=>{const link=event.target.closest('a[href]');if(!link||event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey||link.target==='_blank'||link.hasAttribute('download'))return;const url=new URL(link.href,location.href);if(url.origin!==location.origin||!url.pathname.startsWith('/erp/')||url.href===location.href)return;event.preventDefault();root.classList.add('page-transition-out');sessionStorage.setItem('ssm-page-transition','1');setTimeout(()=>location.assign(url.href),190)})})();</script></body></html>
