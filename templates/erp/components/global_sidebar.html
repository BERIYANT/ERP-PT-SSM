g><aside class="global-sidebar"><div class="brand"><img class="brand-logo brand-logo--square" src="{% static 'img/logo-ssm.svg' %}?v=20260818-2" alt="Logo SSM"><div class="brand-copy">SSM ERP<small>PROJECT CONTROL</small></div></div><div class="nav-label">Menu Utama</div><nav class="global-nav">{% for key,label,url_name in global_navigation %}<a href="{% url url_name %}" title="{{ label }}" aria-label="{{ label }}" class="{% if active_global_nav == key %}active{% endif %}"><svg class="nav-icon" aria-hidden="true"><use href="#nav-{{ key }}"></use></svg><span class="nav-text">{{ label }}</span></a>{% endfor %}</nav><button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Perkecil sidebar" aria-expanded="true"><span>‹</span><em>Tutup sidebar</em></button><a class="sidebar-profile" href="{% url 'erp:profile' %}" title="Pengaturan profil" aria-label="Buka pengaturan profil"><span class="sidebar-profile__avatar">{{ request.user.nama|default:request.user.username|slice:':1'|upper }}</span><span class="sidebar-profile__copy"><strong>{{ request.user.nama|default:request.user.username }}</strong><small>{{ request.user.role|upper }}</small><em>Pengaturan profil</em></span><span class="sidebar-profile__arrow" aria-hidden="true">›</span></a></aside><script>(function(){const shell=document.querySelector('.erp-shell');const button=document.getElementById('sidebarToggle');if(!shell||!button)return;const apply=value=>{shell.classList.toggle('sidebar-collapsed',value);button.setAttribute('aria-expanded',String(!value));button.setAttribute('aria-label',value?'Perbesar sidebar':'Perkecil sidebar')};apply(localStorage.getItem('ssm-sidebar-collapsed')==='1');button.addEventListener('click',()=>{const value=!shell.classList.contains('sidebar-collapsed');apply(value);localStorage.setItem('ssm-sidebar-collapsed',value?'1':'0')})})();</script>
