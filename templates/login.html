<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM Portal Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            min-height: 100vh;
            background-color: #f5f5f5;
        }

        /* Container utama - layout dua kolom */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* Bagian kiri - Gambar (2/3 dari layar) */
        .image-section {
            flex: 0 0 66.666%;
            background: url('/static/images/pemandangan.png') center center / cover no-repeat;
            position: relative;
        }

        /* Bagian kanan - Form Login (1/3 dari layar) */
        .login-section {
            flex: 0 0 33.333%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background-color: white;
        }

        /* Login Card */
        .login-card {
            width: 100%;
            max-width: 450px;
            padding: 40px 35px;
            background: white;
        }

        /* Logo */
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            width: 70px;
            height: auto;
        }

        /* Header */
        .logo-header {
            text-align: center;
            margin-bottom: 45px;
        }

        .welcome-text {
            color: #00a6ca;
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .portal-name {
            color: #00a6ca;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Form */
        .form-group {
            margin-bottom: 28px;
        }

        .form-label {
            display: block;
            color: #333;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-icon svg {
            width: 20px;
            height: 20px;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px 16px 55px;
            border: 1px solid #e0e0e0;
            border-radius: 50px;
            font-size: 15px;
            color: #333;
            background-color: #f8f9fa;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #00a6ca;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(0, 166, 202, 0.1);
        }

        .form-input::placeholder {
            color: #aaa;
        }

        .password-toggle {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
        }

        .password-toggle:hover {
            color: #00a6ca;
        }

        /* Button */
        .login-button {
            width: 100%;
            background: #ffffff;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 166, 202, 0.3);
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 166, 202, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* Forgot Password */
        .forgot-password {
            text-align: center;
            margin-top: 25px;
        }

        .forgot-password a {
            color: #00a6ca;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #008ba8;
            text-decoration: underline;
        }

        /* Copyright */
        .copyright {
            text-align: center;
            margin-top: 50px;
            padding-top: 25px;
            border-top: 1px solid #e8e8e8;
            color: #999;
            font-size: 13px;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .container {
                flex-direction: column;
                height: auto;
            }

            .image-section {
                flex: 0 0 300px;
                min-height: 300px;
            }

            .login-section {
                flex: 1;
                min-height: calc(100vh - 300px);
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 25px;
            }

            .portal-name {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Bagian Kiri: Gambar (2/3) -->
        <div class="image-section"></div>

        <!-- Bagian Kanan: Form Login (1/3) -->
        <div class="login-section">
            <div class="login-card">
                <!-- Logo SSM -->
                <div class="logo-container">
                    <img src="{{ url_for('static', filename='images/logo_ssm.png') }}" alt="SSM Logo">
                </div>

                <!-- Header -->
                <div class="logo-header">
                    <div class="welcome-text">Welcome To</div>
                    <div class="portal-name">SSM PORTAL</div>
                </div>

                <!-- Form Login -->
                <form id="loginForm" action="dashboard.html" method="GET">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            <input type="text" id="username" class="form-input" placeholder="Enter User Name Here"
                                autocomplete="username" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input type="password" id="password" class="form-input" placeholder="Enter Password"
                                autocomplete="current-password" required>
                            <span class="password-toggle" id="togglePassword">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-open">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-closed"
                                    style="display: none;">
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                    </path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <button type="submit" class="login-button">Login</button>
                </form>

                <div class="forgot-password">
                    <a href="#forgot">Forgot Password?</a>
                </div>

                <div class="copyright">
                    Copyright © 2026 Satria Sakti Mandiri. All rights reserved
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const eyeOpen = this.querySelector('.eye-open');
            const eyeClosed = this.querySelector('.eye-closed');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // Toggle eye icons
            if (type === 'password') {
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            } else {
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            }
        });

        // Form validation and submission
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username) {
                alert('Please enter your username');
                document.getElementById('username').focus();
                return;
            }

            if (!password) {
                alert('Please enter your password');
                document.getElementById('password').focus();
                return;
            }

            // Simulate login process
            const loginButton = document.querySelector('.login-button');
            const originalText = loginButton.textContent;

            loginButton.textContent = 'LOGGING IN...';
            loginButton.disabled = true;
            loginButton.style.opacity = '0.7';

            // Panggil API login
            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
                credentials: 'same-origin'
            })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '/dashboard';
                    } else {
                        alert(data.message || 'Username atau password salah.');
                        loginButton.textContent = originalText;
                        loginButton.disabled = false;
                        loginButton.style.opacity = '1';
                        document.getElementById('password').value = '';
                    }
                })
                .catch(() => {
                    alert('Gagal terhubung ke server. Pastikan server sudah berjalan.');
                    loginButton.textContent = originalText;
                    loginButton.disabled = false;
                    loginButton.style.opacity = '1';
                });
        });

        // Focus username field on page load
        window.addEventListener('load', function () {
            document.getElementById('username').focus();
        });
    </script>
</body>

</html>
